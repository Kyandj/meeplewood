<svg xmlns="http://www.w3.org/2000/svg" width="225" height="400" viewBox="0 0 225 400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- everything inside the card is cut off at the rounded corners -->
    <clipPath id="card-clip">
      <rect x="3" y="3" width="219" height="394" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- white card -->
    <rect id="bg-rect" x="0" y="0" width="225" height="400" fill="white"/>

    <!-- ground: behind the tree, this is the part that moves (script.js changes its transform) -->
    <path id="ground" transform="translate(0,400)" fill="#9ccc65"
          d="M0,6 C30,-2 55,-2 80,5 S130,14 160,6 S205,-2 225,4 L225,420 L0,420 Z"/>

    <!-- tree (fixed position) -->
    <path d="M116,345 C119,290 121,240 124,190 L136,190 C139,240 141,290 144,345 Z" fill="#8a4b2a"/>
    <g fill="#66bb6a">
      <circle cx="130" cy="150" r="42"/>
      <circle cx="95" cy="165" r="30"/>
      <circle cx="165" cy="165" r="30"/>
      <circle cx="110" cy="115" r="32"/>
      <circle cx="150" cy="115" r="32"/>
      <circle cx="130" cy="95" r="28"/>
    </g>

    <!-- blossom on the canopy -->
    <g>
      <circle cx="108" cy="140" r="7" fill="#f06292"/>
      <circle cx="108" cy="140" r="3" fill="#ffd54f"/>
      <circle cx="150" cy="130" r="7" fill="#f06292"/>
      <circle cx="150" cy="130" r="3" fill="#ffd54f"/>
      <circle cx="130" cy="110" r="7" fill="#f06292"/>
      <circle cx="130" cy="110" r="3" fill="#ffd54f"/>
      <circle cx="100" cy="100" r="7" fill="#f06292"/>
      <circle cx="100" cy="100" r="3" fill="#ffd54f"/>
      <circle cx="160" cy="105" r="7" fill="#f06292"/>
      <circle cx="160" cy="105" r="3" fill="#ffd54f"/>
      <circle cx="132" cy="165" r="7" fill="#f06292"/>
      <circle cx="132" cy="165" r="3" fill="#ffd54f"/>
    </g>

    <!-- number and flower (fixed position) -->
    <text id="season-count" x="22" y="52" font-family="sans-serif" font-size="38" fill="#ec407a">0</text>
    <g fill="#f06292">
      <circle cx="42" cy="66" r="9"/>
      <circle cx="29" cy="79" r="9"/>
      <circle cx="55" cy="79" r="9"/>
      <circle cx="35" cy="92" r="9"/>
      <circle cx="49" cy="92" r="9"/>
    </g>
    <circle cx="42" cy="79" r="7" fill="#ffd54f"/>
  </g>

  <!-- card outline -->
  <rect x="3" y="3" width="219" height="394" rx="22" fill="none" stroke="#111" stroke-width="3"/>
</svg>