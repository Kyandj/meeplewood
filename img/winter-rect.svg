<svg xmlns="http://www.w3.org/2000/svg" width="225" height="400" viewBox="0 0 225 400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- everything inside the card is cut off at the rounded corners -->
    <clipPath id="card-clip">
      <rect x="3" y="3" width="219" height="394" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- white card -->
    <rect id="bg-rect" x="0" y="0" width="225" height="400" fill="white"/>

    <!-- falling snow -->
    <g fill="#c4c4c4">
      <circle cx="142" cy="46" r="4"/>
      <circle cx="94" cy="61" r="4"/>
      <circle cx="192" cy="66" r="4"/>
      <circle cx="124" cy="90" r="4"/>
      <circle cx="178" cy="105" r="4"/>
      <circle cx="72" cy="117" r="4"/>
      <circle cx="201" cy="122" r="4"/>
      <circle cx="32" cy="136" r="4"/>
      <circle cx="48" cy="171" r="4"/>
      <circle cx="195" cy="181" r="4"/>
      <circle cx="26" cy="205" r="4"/>
      <circle cx="77" cy="200" r="4"/>
      <circle cx="161" cy="212" r="4"/>
      <circle cx="50" cy="228" r="4"/>
      <circle cx="199" cy="230" r="4"/>
      <circle cx="89" cy="241" r="4"/>
      <circle cx="170" cy="254" r="4"/>
    </g>

    <!-- ground: behind the tree, this is the part that moves (script.js changes its transform). called "snow" here because this is the winter card -->
    <path id="ground" transform="translate(0,400)" fill="#9dd4f3"
          d="M0,6 C30,-2 55,-2 80,5 S130,14 160,6 S205,-2 225,4 L225,420 L0,420 Z"/>

    <!-- tree (fixed position) -->
    <g fill="none" stroke="#8a4b2a" stroke-width="7" stroke-linecap="round">
      <path d="M130,195 L130,112"/>
      <path d="M127,190 L102,108"/>
      <path d="M133,185 L153,92"/>
      <path d="M125,225 Q100,190 81,152"/>
      <path d="M136,175 Q160,160 177,133"/>
      <path d="M165,155 L165,133" stroke-width="5"/>
      <path d="M140,172 L178,166" stroke-width="5"/>
    </g>
    <path d="M116,345 C119,290 121,240 124,190 L136,190 C139,240 141,290 144,345 Z" fill="#8a4b2a"/>

    <!-- snow on the branches -->
    <g fill="white" stroke="#c4c4c4" stroke-width="1">
      <ellipse cx="102" cy="106" rx="4.5" ry="6"/>
      <ellipse cx="130" cy="110" rx="4.5" ry="6"/>
      <ellipse cx="153" cy="90" rx="4.5" ry="6"/>
      <ellipse cx="81" cy="150" rx="4.5" ry="6"/>
      <ellipse cx="177" cy="131" rx="4.5" ry="6"/>
      <ellipse cx="165" cy="131" rx="4" ry="5"/>
      <ellipse cx="178" cy="166" rx="4.5" ry="6"/>
    </g>


    <!-- number and snowflake (fixed position) -->
    <text id="season-count" x="22" y="52" font-family="sans-serif" font-size="38" fill="#7ba3e0">0</text>
    <g stroke="#7ba3e0" stroke-width="3.5" stroke-linecap="round">
      <line x1="42" y1="53" x2="42" y2="97"/>
      <line x1="20" y1="75" x2="64" y2="75"/>
      <line x1="26" y1="59" x2="58" y2="91"/>
      <line x1="58" y1="59" x2="26" y2="91"/>
    </g>
  </g>

  <!-- card outline -->
  <rect x="3" y="3" width="219" height="394" rx="22" fill="none" stroke="#111" stroke-width="3"/>
</svg>