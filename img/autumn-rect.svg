<svg xmlns="http://www.w3.org/2000/svg" width="225" height="400" viewBox="0 0 225 400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- everything inside the card is cut off at the rounded corners -->
    <clipPath id="card-clip">
      <rect x="3" y="3" width="219" height="394" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- white card -->
    <rect id="bg-rect" x="0" y="0" width="225" height="400" fill="white"/>

    <!-- falling leaves -->
    <g>
      <ellipse cx="142" cy="60" rx="5" ry="8" fill="#fb8c00" transform="rotate(20 142 60)"/>
      <ellipse cx="94" cy="80" rx="5" ry="8" fill="#e53935" transform="rotate(-15 94 80)"/>
      <ellipse cx="192" cy="90" rx="5" ry="8" fill="#ffca28" transform="rotate(35 192 90)"/>
      <ellipse cx="72" cy="120" rx="5" ry="8" fill="#e53935" transform="rotate(-25 72 120)"/>
      <ellipse cx="201" cy="140" rx="5" ry="8" fill="#fb8c00" transform="rotate(10 201 140)"/>
      <ellipse cx="32" cy="160" rx="5" ry="8" fill="#ffca28" transform="rotate(-10 32 160)"/>
      <ellipse cx="48" cy="200" rx="5" ry="8" fill="#e53935" transform="rotate(25 48 200)"/>
      <ellipse cx="195" cy="210" rx="5" ry="8" fill="#fb8c00" transform="rotate(-30 195 210)"/>
      <ellipse cx="60" cy="250" rx="5" ry="8" fill="#ffca28" transform="rotate(15 60 250)"/>
      <ellipse cx="181" cy="260" rx="5" ry="8" fill="#e53935" transform="rotate(-20 181 260)"/>
      <ellipse cx="105" cy="270" rx="5" ry="8" fill="#fb8c00" transform="rotate(30 105 270)"/>
      <ellipse cx="165" cy="300" rx="5" ry="8" fill="#ffca28" transform="rotate(-15 165 300)"/>
    </g>

    <!-- ground: behind the tree, this is the part that moves (script.js changes its transform) -->
    <path id="ground" transform="translate(0,400)" fill="#c76625"
          d="M0,6 C30,-2 55,-2 80,5 S130,14 160,6 S205,-2 225,4 L225,420 L0,420 Z"/>

    <!-- tree (fixed position) -->
    <path d="M116,345 C119,290 121,240 124,190 L136,190 C139,240 141,290 144,345 Z" fill="#8a4b2a"/>
    <g fill="#f57c00">
      <circle cx="130" cy="150" r="42"/>
      <circle cx="95" cy="165" r="30"/>
      <circle cx="165" cy="165" r="30"/>
      <circle cx="110" cy="115" r="32"/>
      <circle cx="150" cy="115" r="32"/>
      <circle cx="130" cy="95" r="28"/>
    </g>
    <g fill="#ffb300">
      <circle cx="112" cy="145" r="10"/>
      <circle cx="150" cy="135" r="10"/>
      <circle cx="130" cy="105" r="10"/>
      <circle cx="160" cy="170" r="10"/>
    </g>

    <!-- number and leaf (fixed position) -->
    <text id="season-count" x="22" y="52" font-family="sans-serif" font-size="38" fill="#e64a19">0</text>
    <path transform="translate(42,78)" fill="#e64a19"
          d="M0,-20 C4,-14 14,-12 16,-4 C21,-6 26,-1 22,5
             C28,8 27,16 20,15 C23,21 17,25 11,21
             C10,27 1,28 0,22 C-1,28 -10,27 -11,21
             C-17,25 -23,21 -20,15 C-27,16 -28,8 -22,5
             C-26,-1 -21,-6 -16,-4 C-14,-12 -4,-14 0,-20 Z"/>
    <line x1="42" y1="100" x2="42" y2="110" stroke="#e64a19" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- card outline -->
  <rect x="3" y="3" width="219" height="394" rx="22" fill="none" stroke="#111" stroke-width="3"/>
</svg>